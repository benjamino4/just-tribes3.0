<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>TRIBES — Rise from the Stone</title>
<meta name="theme-color" content="#0a0612" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<script>
  tailwind.config = {
    theme: { extend: {
      fontFamily: { display: ['Cinzel','serif'], sans: ['Inter','sans-serif'] },
      colors: {
        ember: '#ff6b1a', flame: '#ffb03a', coal: '#0a0612', ash: '#b9a7c9',
        pyre: '#ff3d3d', gold: '#ffd77a', night: '#150c22'
      }
    } }
  }
</script>
</head>
<body>
<!-- ===== ambient cosmos ===== -->
<div class="aurora" aria-hidden="true">
  <span class="aurora-band b1"></span>
  <span class="aurora-band b2"></span>
  <span class="aurora-band b3"></span>
</div>
<canvas id="starfield" aria-hidden="true"></canvas>

<!-- ===== stone-era living firelight scene ===== -->
<div class="cave" aria-hidden="true">
  <div class="cave-glow"></div>
  <svg class="cave-art" viewBox="0 0 400 240" preserveAspectRatio="xMidYMax slice">
    <g class="handprints">
      <path d="M40 70c-3-8 2-14 5-8 1-6 6-6 6 0 2-5 6-4 6 1 3-4 6-1 4 4 4 0 5 4 1 7l-9 6-11-3z"/>
      <path d="M330 50c-3-8 2-14 5-8 1-6 6-6 6 0 2-5 6-4 6 1 3-4 6-1 4 4 4 0 5 4 1 7l-9 6-11-3z"/>
    </g>
    <g class="cave-beasts">
      <path d="M60 210c0-16 10-26 30-26s28 10 30 20c6-2 10 2 8 6-2 3-8 3-10 0-8 6-40 6-48 0-6 4-12 0-10-6 0-4 0-6 0 6z"/>
      <path d="M300 214c4-14 16-22 34-18 6-8 16-6 16 2 4 0 6 4 2 7-10 6-30 8-42 4-4 6-12 6-10-1z"/>
    </g>
  </svg>
  <div class="cave-rocks"></div>
  <div class="bonfire">
    <span class="bf f1"></span><span class="bf f2"></span><span class="bf f3"></span>
    <span class="bf-log"></span><span class="bf-log l2"></span>
  </div>
  <div class="sparks" id="sparks"></div>
  <div class="firelight"></div>
</div>
<div class="vignette" aria-hidden="true"></div>

<!-- ===== boot splash ===== -->
<div id="splash" class="splash">
  <div class="splash-fire">
    <svg viewBox="0 0 120 160" class="logo-flame"><use href="#flameSvg"/></svg>
  </div>
  <h1 class="splash-title">TRIBES</h1>
  <p class="splash-sub">Rise from the Stone</p>
  <div class="splash-bar"><i></i></div>
</div>

<div id="app" class="app">
  <header class="topbar">
    <div class="tb-brand">
      <div class="tb-mark"><svg viewBox="0 0 120 160"><use href="#flameSvg"/></svg></div>
      <div class="tb-name">TRI<span>BES</span></div>
    </div>
    <div class="tb-wallet">
      <button id="btnEmber" class="chip chip-ember" title="Your Ember">
        <span class="chip-ico">EMB</span><b id="emberBal">0</b>
      </button>
      <button id="btnStars" class="chip chip-star" title="Telegram Stars">
        <span class="chip-ico">STR</span><b id="starBal">0</b>
      </button>
      <button id="btnWallet" class="chip chip-wallet">Connect</button>
    </div>
  </header>

  <main class="screens" id="screens">
    <section id="screen-fire"  class="screen active" data-screen="fire"></section>
    <section id="screen-tribe" class="screen" data-screen="tribe"></section>
    <section id="screen-ranks" class="screen" data-screen="ranks"></section>
    <section id="screen-lands" class="screen" data-screen="lands"></section>
    <section id="screen-store" class="screen" data-screen="store"></section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-tab="fire"><span class="tab-ico ic-fire"></span><span class="tab-lbl">Fire</span></button>
    <button class="tab" data-tab="tribe"><span class="tab-ico ic-tribe"></span><span class="tab-lbl">Tribe</span></button>
    <button class="tab" data-tab="ranks"><span class="tab-ico ic-ranks"></span><span class="tab-lbl">Ranks</span></button>
    <button class="tab" data-tab="lands"><span class="tab-ico ic-lands"></span><span class="tab-lbl">Lands</span></button>
    <button class="tab" data-tab="store"><span class="tab-ico ic-sky"></span><span class="tab-lbl">Sky</span></button>
    <span class="tab-glider" id="tabGlider"></span>
  </nav>
</div>

<!-- toast + modal roots -->
<div id="toastRoot" class="toast-root"></div>
<div id="modalRoot" class="modal-root"></div>

<!-- ===== reusable SVG defs (no images anywhere) ===== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
  <linearGradient id="gFlame" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#ff2d00"/>
    <stop offset=".45" stop-color="#ff6b1a"/>
    <stop offset=".8" stop-color="#ffb03a"/>
    <stop offset="1" stop-color="#ffe89a"/>
  </linearGradient>
  <linearGradient id="gFlameCore" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#ffb03a"/>
    <stop offset="1" stop-color="#fff6d6"/>
  </linearGradient>
  <radialGradient id="gGlow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#ff8a3a" stop-opacity=".9"/>
    <stop offset="1" stop-color="#ff6b1a" stop-opacity="0"/>
  </radialGradient>
  <g id="flameSvg">
    <path fill="url(#gFlame)" d="M60 8c6 26-14 34-14 58 0 16 8 26 8 40 0 6-4 10-4 14 22-4 42-22 42-52 0-30-24-38-32-60z"/>
    <path fill="url(#gFlameCore)" d="M60 58c3 14-8 20-8 34 0 10 6 14 8 20 10-4 16-16 16-30 0-16-12-18-16-24z"/>
  </g>
</defs>
</svg>
<script src="app.js"></script>
</body>
</html>
