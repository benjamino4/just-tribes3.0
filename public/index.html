<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#08080A" />
  <title>HUBRIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <!-- living monochrome aurora behind the glass -->
  <div class="aurora" aria-hidden="true">
    <span class="aurora-blob a"></span>
    <span class="aurora-blob b"></span>
    <span class="aurora-blob c"></span>
    <div class="grain"></div>
  </div>

  <section id="splash" class="splash">
    <!-- Uploaded monochrome collapse clip; blended over the dark shell. -->
    <video class="splash-fall" aria-hidden="true" autoplay muted loop playsinline preload="auto" disablepictureinpicture>
      <source src="/fall.mp4" type="video/mp4" />
    </video>
    <div class="splash-fall-veil" aria-hidden="true"></div>
    <div class="splash-mark">H</div>
    <h1 class="splash-word" aria-label="HUBRIS">
      <span>H</span><span>U</span><span>B</span><span>R</span><span>I</span><span>S</span>
    </h1>
    <blockquote id="splash-quote"></blockquote>
    <cite id="splash-author"></cite>
  </section>

  <main id="app" class="app hidden">
    <header class="topbar">
      <div class="user-name" id="user-name">Guest</div>
      <div class="points-pill">
        <span class="coin" aria-hidden="true">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" xmlns="http://www.w3.org/2000/svg">
            <path d="m8 5.75v8.25m-4.75-6.25h-1.5c0 4 2.5 6.5 6.25 6.5s6.25-2.5 6.25-6.5h-1.5"/>
            <circle cx="8" cy="3.5" r="1.75"/>
          </svg>
        </span>
        <span id="points">0</span>
        <span class="unit">Ichor</span>
      </div>
    </header>

    <div class="tab-viewport" id="tab-viewport">
      <section class="tab-pane" data-pane="home">
        <div class="streak-row">
          <span class="flame">◉</span>
          <span class="streak-num" id="streak">0</span>
          <span class="streak-label">day streak</span>
        </div>
        <div id="challenge-mount" class="challenge-mount"></div>
        <div id="quests-mount" class="quests-mount"></div>
      </section>

      <section class="tab-pane" data-pane="summon">
        <div class="pane-head">
          <h1 class="pane-title">Your Summons</h1>
          <p class="pane-sub">Every soul who answers becomes Oathbound to you</p>
        </div>
        <div id="referral-mount" class="referral-mount"></div>
      </section>

      <section class="tab-pane" data-pane="board">
        <div class="pane-head">
          <h1 class="pane-title">The Pantheon</h1>
          <p class="pane-sub">Top 100 · sorted by Ichor</p>
        </div>
        <div id="board-mount" class="board-mount"></div>
      </section>
    </div>

    <nav class="tabbar" id="tabbar">
      <div class="tabbar-pill"></div>
      <button class="tab-item active" data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>
        </svg>
        <span>Today</span>
      </button>
      <button class="tab-item" data-tab="summon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="8" r="3.2"/><path d="M3.4 19.2a5.6 5.6 0 0 1 11.2 0"/><path d="M18.5 7v6M15.5 10h6"/>
        </svg>
        <span>Summon</span>
      </button>
      <button class="tab-item" data-tab="board">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 21h8M12 17v4M17 4h3v3a4 4 0 0 1-4 4M7 4H4v3a4 4 0 0 0 4 4"/>
          <path d="M7 4h10v7a5 5 0 0 1-10 0z"/>
        </svg>
        <span>Pantheon</span>
      </button>
    </nav>
  </main>

  <!-- The Antechamber: the invite-gate shown before the gates open. -->
  <section id="antechamber" class="antechamber hidden">
    <div class="ante-rings" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>
    <div id="antechamber-mount" class="antechamber-mount"></div>
  </section>

  <div id="reveal-overlay" class="reveal-overlay hidden">
    <div class="reveal-flip" id="reveal-flip">
      <!-- front: the card the player just locked, face down -->
      <div class="reveal-face reveal-front">
        <div class="reveal-ring"></div>
        <div class="reveal-icon" id="reveal-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.5" r="2"/><path d="M12 6.5V21"/><path d="M8 10h8"/><path d="M20 15a8 8 0 0 1-16 0"/><path d="M4 15H2m2 0 2.2 2.2M20 15h2m-2 0-2.2 2.2"/></svg>
        </div>
        <h2 class="reveal-title">Locked In</h2>
        <p class="reveal-sub">Turning your card&hellip;</p>
      </div>
      <!-- back: the admin's details for this option, then your opinion -->
      <div class="reveal-face reveal-back">
        <div class="reveal-opt-letter" id="reveal-opt-letter">&mdash;</div>
        <h2 class="reveal-title" id="reveal-title">Locked In</h2>
        <div class="reveal-detail" id="reveal-detail"></div>
        <div class="reveal-op" id="reveal-op">
          <label class="reveal-op-label" for="reveal-opinion">Your take <span>(optional)</span></label>
          <textarea id="reveal-opinion" class="reveal-opinion" maxlength="280" rows="3" placeholder="Why this call? Say your piece…"></textarea>
          <div class="reveal-op-foot"><span class="reveal-op-count" id="reveal-op-count">0/280</span></div>
          <div class="reveal-actions">
            <button class="reveal-btn ghost" id="reveal-keep" type="button">Keep private</button>
            <button class="reveal-btn" id="reveal-send" type="button">Send anonymously</button>
          </div>
          <p class="reveal-op-note" id="reveal-op-note">Anonymous takes are moderated before anyone sees them.</p>
        </div>
        <div class="reveal-time" id="reveal-time">&mdash;</div>
        <button class="reveal-btn ghost wide" id="reveal-btn" type="button">Got it</button>
      </div>
    </div>
  </div>

  <div id="reward-overlay" class="reward-overlay hidden">
    <canvas id="reward-canvas"></canvas>
    <div class="reward-content">
      <div class="reward-halo" aria-hidden="true">
        <span class="reward-ring r1"></span>
        <span class="reward-ring r2"></span>
        <span class="reward-ring r3"></span>
        <span class="reward-gem"></span>
      </div>
      <div class="reward-label" id="reward-label">Best Call</div>
      <div class="reward-points" id="reward-points">+100</div>
      <div class="reward-sub" id="reward-sub">Ichor added to your vault</div>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
