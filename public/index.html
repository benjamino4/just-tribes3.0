<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>TRIBES — Rise of the Tribes</title>
<meta name="theme-color" content="#0a0705"/>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"/>
</head>
<body>

<div class="world" aria-hidden="true">
  <div class="strata"></div>
  <div class="cavepaint"></div>
  <div class="torch torch-l"></div>
  <div class="torch torch-r"></div>
  <div class="emberfield" id="emberfield"></div>
  <div class="heat"></div>
  <div class="vig"></div>
</div>

<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="gFlame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff2d00"/><stop offset=".5" stop-color="#ff7a1a"/><stop offset="1" stop-color="#ffe89a"/></linearGradient>
  <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe6a8"/><stop offset="1" stop-color="#c8862d"/></linearGradient>
  <radialGradient id="gGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff8a2a" stop-opacity=".9"/><stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/></radialGradient>
</defs></svg>

<div id="boot" class="boot">
  <div class="boot-fire"><span></span><span></span><span></span></div>
  <h1 class="boot-title">TRIBES</h1>
  <p class="boot-sub">Rise of the Tribes</p>
  <div id="bootMsg" class="boot-msg">Waking the ancestors…</div>
  <button id="retryBtn" class="btn btn-primary btn-shine" style="display:none">Retry the summons</button>
</div>

<div id="app" class="app" style="display:none">
  <header class="topbar">
    <button id="crestBtn" class="crest-chip"><span id="crestArt" class="crest-art"></span>
      <span class="crest-meta"><b id="tribeName">No Tribe</b><i id="roleName">Wanderer</i></span></button>
    <div class="wallets">
      <span class="purse" title="Ember"><span class="pico pico-ember"></span><b id="emberVal">0</b></span>
      <span class="purse" title="Stars"><span class="pico">⭐</span><b id="starVal">0</b></span>
      <button id="tonBtn" class="ton-chip">Connect</button>
    </div>
  </header>

  <main id="screens" class="screens"></main>

  <nav class="nav">
    <button class="nav-i active" data-tab="fire"><span class="ni">🔥</span><b>Fire</b></button>
    <button class="nav-i" data-tab="tribe"><span class="ni">🛖</span><b>Tribe</b></button>
    <button class="nav-i war" data-tab="war"><span class="ni">⚔️</span><b>War</b></button>
    <button class="nav-i" data-tab="ranks"><span class="ni">🏆</span><b>Ranks</b></button>
    <button class="nav-i" data-tab="store"><span class="ni">🪓</span><b>Store</b></button>
  </nav>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root"></div>
<div id="fxRoot" aria-hidden="true"></div>

<script src="app.js"></script>
</body>
</html>
