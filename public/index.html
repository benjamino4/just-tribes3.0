<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Daily Call</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <!-- Quote Reveal -->
  <section id="entry" class="entry">
    <div class="quote-line"></div>
    <blockquote id="quote-text"></blockquote>
    <cite id="quote-author"></cite>
  </section>

  <!-- Home -->
  <section id="home" class="hidden">
    <header class="topbar">
      <div class="user-info" id="user-name">Guest</div>
      <div class="points-pill">
        <span class="icon">★</span>
        <span id="points">0</span>
      </div>
    </header>

    <div class="streak-row">
      <span class="streak-flame">🔥</span>
      <span class="streak-num" id="streak">0</span>
      <span>day streak</span>
    </div>

    <div id="challenge-wrap" class="challenge-wrap"></div>
    <div id="quests-wrap" class="quests-wrap"></div>

    <div class="board">
      <div class="board-title">The Circle</div>
      <div id="board-list"></div>
    </div>
  </section>

  <script type="module" src="/app.js"></script>
</body>
</html>
