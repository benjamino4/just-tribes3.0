<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>TRIBES — Rise of the Tribes [v99]</title>
<meta name="theme-color" content="#07060a"/>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=110"/>
</head>
<body>

<div class="world" aria-hidden="true">
  <div class="heat"></div>
  <div class="vig"></div>
</div>

<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="gFlame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff2d00"/><stop offset=".5" stop-color="#ff7a1a"/><stop offset="1" stop-color="#ffe89a"/></linearGradient>
  <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe6a8"/><stop offset="1" stop-color="#c8862d"/></linearGradient>
  <radialGradient id="gGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff8a2a" stop-opacity=".9"/><stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/></radialGradient>
</defs></svg>

<div id="boot" class="boot">
  <div class="boot-orb">
    <div class="core"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="spark"></div>
    <div class="spark" style="animation-delay:-1.3s"></div>
  </div>
  <h1 class="boot-title">TRIBES</h1>
  <p class="boot-sub">Rise of the Tribes</p>
  <div id="bootMsg" class="boot-msg">Waking the ancestors…</div>
  <button id="retryBtn" class="btn btn-primary btn-shine" style="display:none;margin-top:16px">Retry the summons</button>
</div>

<div id="gate" class="gate" style="display:none">
  <div class="gate-card">
    <div class="gate-icon">🪪</div>
    <h2>Set a Telegram Username</h2>
    <p class="tiny">Tribes require a name to march under. Set a <b>@username</b> in Telegram, then return here.</p>
    <a href="tg://settings" id="gateLink" class="btn btn-primary btn-shine btn-block" target="_blank" rel="noopener">Open Telegram Settings</a>
    <button id="gateRetry" class="btn btn-ghost btn-block" style="margin-top:8px">I've set it — retry</button>
    <p class="tiny" style="margin-top:14px;opacity:.7">In Telegram: Settings → Username → set one → save. Then tap “I've set it”.</p>
  </div>
</div>

<div id="app" class="app" style="display:none">
  <header class="topbar">
    <button id="crestBtn" class="chip crest-chip">
      <span id="crestArt" class="crest-art"></span>
      <span class="crest-meta"><b id="tribeName">No Tribe</b><i id="roleName">Wanderer</i></span>
    </button>
    <div class="wallets">
      <span class="chip purse" title="Ember"><span class="pico pico-ember"></span><b id="emberVal">0</b></span>
      <button id="tonBtn" class="chip ton-chip">Connect</button>
    </div>
  </header>

  <div id="bonfireBanner" class="bonfire-banner" style="display:none"></div>

  <main id="screens" class="screens"></main>

  <nav class="nav">
    <button class="nav-i active" data-tab="fire"><span class="ni">🔥</span><b>Fire</b></button>
    <button class="nav-i" data-tab="tribe"><span class="ni">🛖</span><b>Tribe</b></button>
    <button class="nav-i war" data-tab="war"><span class="ni">⚔️</span><b>War</b></button>
    <button class="nav-i" data-tab="ranks"><span class="ni">🏆</span><b>Ranks</b></button>
    <button class="nav-i" data-tab="store"><span class="ni">🪓</span><b>Store</b></button>
  </nav>
</div>

<div id="sheetRoot"></div>
<div id="toastRoot" class="toast-root"></div>
<div id="fxRoot" aria-hidden="true"></div>

<div id="ceremony" class="ceremony" style="display:none">
  <div class="ceremony-burst"></div>
  <div class="ceremony-content">
    <div id="ceremonyIcon" class="ceremony-icon">🏆</div>
    <h2 id="ceremonyTitle">VICTORY</h2>
    <p id="ceremonySub"></p>
  </div>
</div>

<script src="strings.js?v=110"></script>
<script src="perf.js?v=1"></script>`n<script src="app.js?v=110"></script>
<script src="miniapp-extra.js?v=110"></script>
</body>
</html>
