<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>TRIBES — Warden Console</title>
<link rel="stylesheet" href="admin.css?v=8000">
</head>
<body>

<section id="login" class="gate">
  <div class="gate-card">
    <svg class="crest" viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
      <path d="M32 4c6 10-4 14 2 24 4 6 2 12-2 16-5-3-8-9-6-15-6 4-9 12-6 20 2 6 8 11 12 11 9 0 16-7 16-16 0-14-10-22-16-40z"
        fill="#ff7a18">
        <animate attributeName="opacity" values="0.75;1;0.75" dur="2.4s" repeatCount="indefinite"/>
      </path>
    </svg>
    <h1>The Warden's Gate</h1>
    <p class="muted">Keeper of the Great Pyre. Present your token.</p>
    <input id="token" type="password" placeholder="Admin token" autocomplete="off">
    <button id="enterBtn" class="btn primary">Enter the Fire</button>
    <p id="loginErr" class="err"></p>
  </div>
</section>

<main id="console" class="console" hidden>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <span>TRIBES · Warden</span>
    </div>
    <div class="top-actions">
      <span id="liveStats" class="pill stat-pill"></span>
      <span id="maintFlag" class="pill"></span>
      <span id="connState" class="pill conn-off">offline</span>
      <button id="logoutBtn" class="btn ghost sm">Lock</button>
    </div>
  </header>

  <div class="layout">
    <aside class="side">
      <input id="navSearch" class="nav-search" placeholder="Filter sections…" autocomplete="off">
      <nav id="navTree" class="nav-tree"></nav>
    </aside>

    <section class="editor">
      <div id="editorHeader" class="editor-header">
        <h2 id="panelTitle">Overview</h2>
        <span id="panelSub" class="muted"></span>
      </div>
      <div id="panel" class="panel"></div>
    </section>

    <aside class="feed-rail">
      <div class="feed-head">
        <span>Live Feed</span>
        <button id="feedPause" class="btn ghost tiny">Pause</button>
      </div>
      <div id="feedList" class="feed-list"></div>
    </aside>
  </div>

  <div id="toast" class="toast"></div>
</main>

<script src="admin.js?v=8000"></script>
</body>
</html>
