<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F2EFE9" />
  <meta name="robots" content="noindex, nofollow" />
  <title>System</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header class="mobile-topbar">
    <div class="brand-mark">A</div>
    <div class="title">AURUM</div>
    <button class="logout" id="btn-logout-mobile">Out</button>
  </header>

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">A</div>
      <div>
        <div class="brand-title">AURUM</div>
        <div class="brand-sub">Console</div>
      </div>
    </div>
    <nav>
      <button class="nav-item active" data-view="dashboard">Dashboard</button>
      <button class="nav-item" data-view="challenges">Challenges</button>
      <button class="nav-item" data-view="quests">Quests</button>
      <button class="nav-item" data-view="ai">AI Console</button>
      <button class="nav-item" data-view="users">Users</button>
      <button class="nav-item" data-view="broadcast">Broadcast</button>
    </nav>
    <div class="sidebar-foot">
      <div class="who" id="admin-who">—</div>
      <button class="btn-ghost" id="btn-logout">Log out</button>
    </div>
  </aside>

  <main class="main">
    <section class="view active" id="view-dashboard">
      <header class="view-head"><h1>Dashboard</h1></header>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-label">Players</div><div class="stat-value" id="stat-users">—</div></div>
        <div class="stat-card"><div class="stat-label">Picks</div><div class="stat-value" id="stat-picks">—</div></div>
        <div class="stat-card"><div class="stat-label">Quests Done</div><div class="stat-value" id="stat-quests">—</div></div>
        <div class="stat-card accent"><div class="stat-label">Open</div><div class="stat-value" id="stat-open">—</div></div>
      </div>
      <div class="panel">
        <h3>Recent Challenges</h3>
        <div id="recent-list" class="list"></div>
      </div>
    </section>

    <section class="view" id="view-challenges">
      <header class="view-head">
        <h1>Challenges</h1>
        <button class="btn-primary" id="btn-new-challenge">+ New</button>
      </header>
      <div id="challenges-list" class="grid"></div>
    </section>

    <section class="view" id="view-quests">
      <header class="view-head">
        <h1>Quests</h1>
        <button class="btn-primary" id="btn-new-quest">+ New</button>
      </header>
      <div id="quests-list" class="grid"></div>
    </section>

    <section class="view" id="view-ai">
      <header class="view-head"><h1>AI Console</h1></header>
      <div class="panel">
        <label>Prompt</label>
        <textarea id="ai-prompt" rows="5"></textarea>
        <div class="row">
          <button class="btn-primary" id="btn-ask-all">Ask All</button>
          <button class="btn-ghost" id="btn-ask-groq">Groq</button>
          <button class="btn-ghost" id="btn-ask-cerebras">Cerebras</button>
          <button class="btn-ghost" id="btn-ask-gemini">Gemini</button>
        </div>
      </div>
      <div id="ai-responses" class="ai-responses"></div>
      <div class="panel"><h3>History</h3><div id="ai-history" class="list"></div></div>
    </section>

    <section class="view" id="view-users">
      <header class="view-head">
        <h1>Users</h1>
        <input id="user-search" type="search" placeholder="Search…" class="search" />
      </header>
      <div class="panel">
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>ID</th><th>Name</th><th>Points</th><th>Streak</th><th>Joined</th><th></th></tr></thead>
            <tbody id="users-tbody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section class="view" id="view-broadcast">
      <header class="view-head"><h1>Broadcast</h1></header>
      <div class="panel">
        <label>Message</label>
        <textarea id="broadcast-msg" rows="5"></textarea>
        <button class="btn-primary" id="btn-broadcast">Send to all</button>
      </div>
    </section>
  </main>

  <nav class="mobile-nav">
    <div class="mobile-nav-inner">
      <button class="mobile-nav-item active" data-view="dashboard">Home</button>
      <button class="mobile-nav-item" data-view="challenges">Games</button>
      <button class="mobile-nav-item" data-view="quests">Quests</button>
      <button class="mobile-nav-item" data-view="ai">AI</button>
      <button class="mobile-nav-item" data-view="users">Users</button>
    </div>
  </nav>

  <dialog id="modal-challenge" class="modal">
    <form method="dialog" id="form-challenge">
      <h2 id="modal-ch-title">New Challenge</h2>
      <label>Date</label><input type="date" name="challenge_date" required />
      <label>Question</label><textarea name="question" rows="3" required></textarea>
      <label>Options (one per line: id|text)</label>
      <textarea name="options_raw" rows="4" placeholder="a|Harvest energy&#10;b|Scout sector" required></textarea>
      <label>Outcome text</label><textarea name="outcome_text" rows="2"></textarea>
      <label class="check"><input type="checkbox" name="use_ai" checked /> Use AI ranking</label>
      <label>Reveal at</label><input type="datetime-local" name="reveal_at" required />
      <div class="modal-foot">
        <button type="button" class="btn-ghost" data-close>Cancel</button>
        <button type="submit" class="btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="modal-quest" class="modal">
    <form method="dialog" id="form-quest">
      <h2 id="modal-quest-title">New Quest</h2>
      <label>Title</label><input type="text" name="title" required />
      <label>Description</label><textarea name="description" rows="2"></textarea>
      <label>Reward</label><input type="number" name="reward" min="1" required />
      <label>Action URL</label><input type="url" name="action_url" />
      <label>Verify text</label><input type="text" name="verify_text" />
      <label>Expires at</label><input type="datetime-local" name="expires_at" />
      <div class="modal-foot">
        <button type="button" class="btn-ghost" data-close>Cancel</button>
        <button type="submit" class="btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="modal-resolve" class="modal">
    <h2>Resolve</h2>
    <div id="resolve-body"></div>
    <div class="modal-foot">
      <button class="btn-ghost" data-close>Close</button>
    </div>
  </dialog>

  <script>
    // Load css + js with BOTH t and i query params so the server can
    // validate every asset request. Page navigations can't send custom
    // headers, so the initData travels in the URL.
    (function () {
      const p = new URLSearchParams(location.search);
      const t = p.get('t') || '';
      const i = p.get('i') || '';
      const qs = (t || i)
        ? '?t=' + encodeURIComponent(t) + '&i=' + encodeURIComponent(i)
        : '';

      window.__AURUM_T = t;
      window.__AURUM_I = i;

      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = './admin.css' + qs;
      document.head.appendChild(link);

      const script = document.createElement('script');
      script.type = 'module';
      script.src = './admin.js' + qs;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
