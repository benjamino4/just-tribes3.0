# ═══════════════════════════════════════════════════════════════════
# FILE: render.yaml
# PURPOSE: Render.com deployment blueprint.
# DEPENDS ON: nothing
# ═══════════════════════════════════════════════════════════════════
services:
  - type: web
    name: tribes
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - { key: NODE_VERSION, value: "20" }
      - { key: NODE_ENV, value: production }
      - { key: DATABASE_URL, sync: false }
      - { key: BOT_TOKEN, sync: false }
      - { key: ADMIN_BOT_TOKEN, sync: false }
      - { key: ADMIN_IDS, sync: false }
      - { key: ADMIN_WEBHOOK_SECRET, sync: false }
      - { key: TG_WEBHOOK_SECRET, sync: false }
      - { key: CRON_SECRET, sync: false }
      - { key: RENDER_API_KEY, sync: false }
      - { key: RENDER_SERVICE_ID, sync: false }
      - { key: APP_URL, sync: false }
      - { key: TON_RECEIVE_ADDRESS, sync: false }
      - { key: TONCENTER_API_KEY, sync: false }
      - { key: TON_NETWORK, value: mainnet }
      - { key: PYSCORE_URL, sync: false }
      - { key: PUSH_ENABLED, value: "0" }
      - { key: PUSH_FLUSH_SECONDS, value: "20" }
      - { key: ALLOW_GUEST, value: "0" }
      - { key: MIGRATE, value: "0" }