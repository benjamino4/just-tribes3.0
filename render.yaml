services:
  - type: web
    name: aurum
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - { key: NODE_VERSION, value: "20" }
      - { key: NODE_ENV, value: production }
      - { key: DATABASE_URL, sync: false }
      - { key: BOT_TOKEN, sync: false }
      - { key: ADMIN_TELEGRAM_ID, sync: false }
      - { key: ADMIN_SECRET, sync: false }
      - { key: ADMIN_PATH, value: "aurum-console-x7k2" }
      - { key: MINI_APP_URL, sync: false }
      - { key: GROQ_API_KEY, sync: false }
      - { key: CEREBRAS_API_KEY, sync: false }
      - { key: GEMINI_API_KEY, sync: false }