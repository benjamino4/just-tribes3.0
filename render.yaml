services:
  - type: web
    name: tribes
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_BOT_TOKEN
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: APP_URL
        sync: false
      - key: TON_RECEIVE_ADDRESS
        sync: false
      - key: TONCENTER_API_KEY
        sync: false
      - key: TON_NETWORK
        value: mainnet
      - key: ALLOW_GUEST
        value: "0"
      - key: PUSH_FLUSH_SECONDS
        value: "20"