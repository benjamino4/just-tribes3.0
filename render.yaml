services:
  - type: web
    name: tribes
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production

      # required secrets — set in Render dashboard
      - key: DATABASE_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_TOKEN
        sync: false

      # optional
      - key: APP_URL
        sync: false
      - key: ADMIN_BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: ADMIN_WEBHOOK_SECRET
        sync: false
      - key: TG_WEBHOOK_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: TON_RECEIVE_ADDRESS
        sync: false
      - key: TONCENTER_API_KEY
        sync: false
      - key: TON_NETWORK
        value: mainnet

      # push notifications
      - key: PUSH_ENABLED
        value: "0"
      - key: PUSH_FLUSH_SECONDS
        value: "20"

      # safe defaults
      - key: ALLOW_GUEST
        value: "0"

      # first deploy only: flip to "1", then back to "0"
      - key: MIGRATE
        value: "0"